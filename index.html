<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1769aa" />
    <meta name="description" content="Pokémon GOの今日の情報、イベント、レイド、各種データと計算ツールを確認できる無料サイト" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const savedTheme = localStorage.getItem('pokemon-go:theme');
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-v2-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-v2-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon-v2.png" />
    <link rel="manifest" href="%BASE_URL%site-v2.webmanifest" />
    <title>Pokémon GO Information</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
